# Release-plz configuration for yeptris-rs
# (modeled on parsanol-rs). See: https://release-plz.dev/docs/config

[workspace]
# Detect all workspace members automatically.
git_release_enable = true
dependencies_update = true

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% if commit.breaking %} (BREAKING){% endif %}\
{% if commit.author != "github-actions[bot]" %} by @{{ commit.author }}{% endif %}\
{% endfor %}
{% endfor %}
"""
