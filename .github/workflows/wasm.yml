name: Rust browser vendored YAML
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-vendored:
    name: Vendored snapshot (macOS)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - run: cargo test --locked --workspace --features vendored
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.50
      - name: Prepare scalar single-thread C runtime
        run: embuilder build libc
      - name: Record pinned build inputs
        run: |
          {
            git rev-parse HEAD
            rustc --version --verbose
            emcc --version
            cat vendor/yeptris/ENGINE_REF
            sha256sum Cargo.lock tests/wasm-smoke/Cargo.lock vendor/yeptris/ENGINE_REF "$(emcc --print-file-name=libc.a)"
          } > build-inputs.txt
          cat build-inputs.txt
      - name: Link Rust and vendored C in both profiles
        run: |
          cargo build --locked --manifest-path tests/wasm-smoke/Cargo.toml --target wasm32-unknown-unknown --release
          cargo build --locked --manifest-path tests/wasm-smoke/Cargo.toml --target wasm32-unknown-unknown
      - uses: actions/cache/restore@v4
        id: cli-cache
        with:
          path: ${{ runner.temp }}/wasm-bindgen-cli
          key: wasm-bindgen-cli-0.2.105-${{ runner.os }}-rust-1.95.0
      - name: Install matching wasm-bindgen tooling in this job's temporary directory
        run: |
          if ! test -x "$RUNNER_TEMP/wasm-bindgen-cli/bin/wasm-bindgen"; then
            cargo install wasm-bindgen-cli --version 0.2.105 --locked --root "$RUNNER_TEMP/wasm-bindgen-cli"
          fi
          echo "$RUNNER_TEMP/wasm-bindgen-cli/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/save@v4
        if: steps.cli-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/wasm-bindgen-cli
          key: wasm-bindgen-cli-0.2.105-${{ runner.os }}-rust-1.95.0
      - name: Generate Node and browser glue
        run: |
          wasm-bindgen tests/wasm-smoke/target/wasm32-unknown-unknown/release/yeptris_wasm_smoke.wasm --out-dir wasm-node --target nodejs
          wasm-bindgen tests/wasm-smoke/target/wasm32-unknown-unknown/release/yeptris_wasm_smoke.wasm --out-dir wasm-web --target web
          wasm-bindgen tests/wasm-smoke/target/wasm32-unknown-unknown/debug/yeptris_wasm_smoke.wasm --out-dir wasm-debug --target nodejs
      - name: Audit final module imports
        run: node tests/wasm-smoke/audit-imports.cjs
      - name: Execute debug and release Node consumers
        run: |
          node -e 'for (const dir of ["wasm-debug", "wasm-node"]) { const m = require(`./${dir}/yeptris_wasm_smoke.js`); if (m.smoke() !== "ok") process.exit(1); console.log(dir + ": smoke passed"); }'

      - name: Install browser consumer tools
        run: |
          npm ci --prefix tests/wasm-smoke --ignore-scripts --no-audit --no-fund
          tests/wasm-smoke/node_modules/.bin/playwright install chromium
      - name: Execute actual browser consumer
        run: node tests/wasm-smoke/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-artifacts
          path: |
            wasm-node
            wasm-web
            wasm-debug
            build-inputs.txt
            tests/wasm-smoke/Cargo.lock
