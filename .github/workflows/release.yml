# Release pipeline for yeptris-rs (modeled on leptris-rs).
#
# On every push to main, release-plz:
#   1. opens/updates a release PR with version bumps + changelog
#      (conventional commits), and
#   2. when that release PR merges, publishes to crates.io.
#
# Publishing uses crates.io TRUSTED PUBLISHING: the workflow's OIDC
# token is exchanged for a registry token by crates-io-auth-action.
# The crate must exist on crates.io first (manual first publish),
# and the crate's Trusted Publisher must be registered:
#   repo: leptris/yeptris-rs, workflow: release.yml
#
# GITHUB_TOKEN must be a PAT (LEPTRIS_CI_PAT_TOKEN) so the release
# PR itself triggers CI — the default token does not recurse.
#
# yeptris-rs links libyeptris (YEPTRIS_LIB_PATH), so both the release
# PR's verification and the publish build the engine from source first.

name: Release

permissions:
  contents: write
  pull-requests: write
  id-token: write

on:
  push:
    branches:
      - main

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout engine repository
        uses: actions/checkout@v4
        with:
          repository: leptris/yeptris
          ref: main
          path: engine

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build the engine shared library
        run: |
          cmake -B engine/build-shared -S engine \
            -DCMAKE_BUILD_TYPE=Release \
            -DYEPTRIS_BUILD_SHARED=ON -DYEPTRIS_BUILD_STATIC=OFF \
            -DBUILD_TESTING=OFF -DYEPTRIS_BUILD_CLI=OFF \
            -DYEPTRIS_BUILD_BENCHMARKS=OFF
          cmake --build engine/build-shared --config Release
          LIB=$(find engine/build-shared -type f -o -type l 2>/dev/null | grep -iE '(lib)?yeptris\.(dylib|so)$' | head -1)
          if [ -z "$LIB" ]; then
            echo "ERROR: libyeptris shared library not found"
            exit 1
          fi
          LIBDIR=$(cd "$(dirname "$LIB")" && pwd)
          echo "YEPTRIS_LIB_PATH=$LIBDIR" >> "$GITHUB_ENV"

      - name: Exchange OIDC token for crates.io token
        if: github.ref == 'refs/heads/main'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          # the default token has contents+PR write on THIS repo — the
          # release PR needs nothing more. (A PAT would also make the
          # release PR's own CI recurse; leptris-rs's LEPTRIS_CI_PAT_TOKEN
          # is not configured on this repo, and the train's first runs
          # failed on the empty secret's ref-creation denial.)
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
